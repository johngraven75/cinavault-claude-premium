<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>CinaVault Premium</title>
    <style>
      html, body, #root {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #04070f;
        font-family: 'Space Grotesk', system-ui, sans-serif;
      }
      /* ── Logo-based Loading Screen (replaces old text splash + brand-splash) ── */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background:
          radial-gradient(circle at 20% 25%, rgba(255, 140, 20, 0.18), transparent 46%),
          radial-gradient(circle at 82% 18%, rgba(0, 140, 220, 0.22), transparent 50%),
          linear-gradient(140deg, #03050c 0%, #091321 45%, #04070f 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2rem;
        transition: opacity 0.85s ease-out;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-logo {
        width: min(72vw, 480px);
        height: auto;
        object-fit: contain;
        filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.7));
        border-radius: 16px;
        animation: logoFadeIn 0.6s ease-out forwards;
      }
      @keyframes logoFadeIn {
        from { opacity: 0; transform: scale(0.94) translateY(12px); }
        to   { opacity: 1; transform: scale(1)    translateY(0); }
      }
      #splash-bar-track {
        width: min(72vw, 480px); height: 3px;
        background: rgba(255,255,255,0.08);
        border-radius: 4px; overflow: hidden;
      }
      #splash-bar {
        height: 100%; width: 0%; border-radius: 4px;
        background: linear-gradient(90deg, #f59e0b, #00d4ff, #a78bfa);
        transition: width 0.35s ease-out;
        box-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
      }
      #splash-status {
        color: rgba(255,255,255,0.35); font-size: 0.7rem;
        margin-top: -1rem; font-family: 'JetBrains Mono', monospace;
        letter-spacing: 0.05em;
      }
    </style>
  </head>
  <body>
    <!-- Logo-based loading screen -->
    <div id="splash">
      <img id="splash-logo" src="/branding/cinavault-logo.png" alt="CinaVault Premium" />
      <div id="splash-bar-track"><div id="splash-bar"></div></div>
      <div id="splash-status">Initializing systems...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
