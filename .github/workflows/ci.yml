name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - build-169-casting
      - build-169-validation
      - build-170-remote-connectivity
      - v2-build-1-04-metadata-poster-repair
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Preventive Gate, Type, Test, Frontend, Rust, and Live Metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Read build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync('build-version.json', 'utf8'));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `display_name=${build.displayName}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_slug=${build.releaseTag.replaceAll('.', '-')}\n`);
          NODE

      - name: Master build completion gate
        id: master_gate
        shell: bash
        run: npm run verify:master-build 2>&1 | tee master-gate.log

      - name: Shared contract conformance gate
        id: contracts
        shell: bash
        run: npm run verify:contracts 2>&1 | tee contracts.log

      - name: Preventive anti-pattern scan
        id: preventive_scan
        shell: bash
        run: npm run scan:preventive 2>&1 | tee preventive.log

      - name: Install frontend dependencies
        id: install
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee install.log

      - name: TypeScript validation
        id: typescript
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee types.log

      - name: Complete regression suite
        id: tests
        shell: bash
        run: |
          set -o pipefail
          node --test \
            tests/carryForwardVerification.test.mjs \
            tests/build170RemoteConnectivity.test.mjs \
            tests/v2Build102UiStability.test.mjs \
            tests/v2Build103CommandPaletteStability.test.mjs \
            tests/platformParityContract.test.mjs \
            2>&1 | tee tests.log

      - name: Production frontend build
        id: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee frontend.log

      - name: Install Tauri Linux prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            imagemagick

      - name: Prepare cross-platform bundle resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/wireguard src-tauri/tools/wireguard src-tauri/tools/cloudflared
          if [ ! -f tools/wireguard/wireguard.exe ]; then
            printf 'CI placeholder for Windows bundle resource\n' > tools/wireguard/wireguard.exe
          fi
          if [ ! -f src-tauri/tools/wireguard/wireguard.exe ]; then
            printf 'CI placeholder for Windows bundle resource\n' > src-tauri/tools/wireguard/wireguard.exe
          fi
          if [ ! -f src-tauri/tools/cloudflared/README.txt ]; then
            printf 'CI placeholder directory for cloud relay resource\n' > src-tauri/tools/cloudflared/README.txt
          fi
          shopt -s nullglob
          for icon in src-tauri/icons/*.png; do
            converted="${icon%.png}.rgba.png"
            convert "$icon" -alpha on -define png:color-type=6 "$converted"
            mv "$converted" "$icon"
          done

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust contract tests and native validation
        id: rust
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast 2>&1 | tee rust-tests.log
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee rust.log

      - name: Live metadata and poster acceptance
        id: live_metadata
        shell: bash
        run: |
          set -euo pipefail
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            live_tvmaze_metadata_poster_acceptance \
            -- --ignored --nocapture \
            2>&1 | tee live-metadata.log
          grep -q "test result: ok" live-metadata.log

      - name: Generate master CI evidence
        if: always()
        id: evidence
        env:
          EVIDENCE_MASTERGATE: ${{ steps.master_gate.outcome }}
          EVIDENCE_CONTRACTS: ${{ steps.contracts.outcome }}
          EVIDENCE_PREVENTIVESCAN: ${{ steps.preventive_scan.outcome }}
          EVIDENCE_INSTALL: ${{ steps.install.outcome }}
          EVIDENCE_TYPESCRIPT: ${{ steps.typescript.outcome }}
          EVIDENCE_TESTS: ${{ steps.tests.outcome }}
          EVIDENCE_FRONTEND: ${{ steps.frontend.outcome }}
          EVIDENCE_RUST: ${{ steps.rust.outcome }}
          EVIDENCE_LIVEMETADATA: ${{ steps.live_metadata.outcome }}
          EVIDENCE_PACKAGING: not_run
        shell: bash
        run: node scripts/generate-master-ci-evidence.mjs

      - name: Publish diagnostics and master evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: master-evidence-${{ steps.identity.outputs.artifact_slug }}-${{ github.sha }}
          path: |
            master-gate.log
            contracts.log
            preventive.log
            install.log
            types.log
            tests.log
            frontend.log
            rust-tests.log
            rust.log
            live-metadata.log
            master-evidence/*
            build-verification/current-build.json
            contracts/v1/contract-manifest.json
          if-no-files-found: warn
          retention-days: 90

      - name: Report evidence to pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f master-evidence/master-ci-evidence.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file master-evidence/master-ci-evidence.md
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "${{ steps.identity.outputs.display_name }} validation ended before evidence generation. Review the workflow logs."
          fi

      - name: Upload frontend build
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinavault-frontend-${{ steps.identity.outputs.artifact_slug }}-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
