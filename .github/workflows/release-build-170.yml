name: CinaVault Master-Gated Windows Release

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

concurrency:
  group: cinavault-master-gated-release
  cancel-in-progress: false

env:
  RELEASE_MONITOR_ISSUE: "49"

jobs:
  authorize:
    name: Authorize current manifest release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 49 &&
       github.event.comment.body == '/release current' &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.authorization.outputs.allowed }}
      display_name: ${{ steps.identity.outputs.display_name }}
      semantic_version: ${{ steps.identity.outputs.semantic_version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      artifact_slug: ${{ steps.identity.outputs.artifact_slug }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Read authoritative build identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync('build-version.json', 'utf8'));
          for (const field of ['displayName', 'semanticVersion', 'releaseTag']) {
            if (!build[field]) throw new Error(`build-version.json missing ${field}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `display_name=${build.displayName}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `semantic_version=${build.semanticVersion}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_tag=${build.releaseTag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `artifact_slug=${build.releaseTag.replaceAll('.', '-')}\n`);
          NODE

      - name: Authorize owner release command
        id: authorization
        shell: bash
        run: echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Register release run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DISPLAY_NAME: ${{ steps.identity.outputs.display_name }}
          RELEASE_TAG: ${{ steps.identity.outputs.release_tag }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELEASE_MONITOR_ISSUE),
              body: `${process.env.DISPLAY_NAME} master-gated release started.\n\nTag: ${process.env.RELEASE_TAG}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}`
            });

  validate:
    name: Master prompt, contracts, and functional acceptance
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Prepare release diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path release-diagnostics | Out-Null

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Master release completion gate
        run: npm run verify:master-release

      - name: Shared contract conformance gate
        run: npm run verify:contracts

      - name: Preventive risk gate
        run: npm run scan:preventive

      - name: TypeScript validation
        run: npm run lint

      - name: Complete regression suite
        run: >-
          node --test
          tests/carryForwardVerification.test.mjs
          tests/build170RemoteConnectivity.test.mjs
          tests/v2Build102UiStability.test.mjs
          tests/v2Build103CommandPaletteStability.test.mjs
          tests/platformParityContract.test.mjs

      - name: Prepare genuine Windows Rust and bundle resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install wireguard -y --no-progress
          $wireGuardCandidates = @(
            'C:\Program Files\WireGuard\wireguard.exe',
            'C:\Program Files (x86)\WireGuard\wireguard.exe'
          )
          $wireGuardSource = $wireGuardCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wireGuardSource) {
            $wireGuardSource = Get-ChildItem 'C:\Program Files*' -Filter wireguard.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $wireGuardSource) { throw 'A genuine WireGuard executable could not be located.' }
          New-Item -ItemType Directory -Force -Path src-tauri/tools/wireguard | Out-Null
          Copy-Item $wireGuardSource src-tauri/tools/wireguard/wireguard.exe -Force

          New-Item -ItemType Directory -Force -Path src-tauri/tools/cloudflared | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile src-tauri/tools/cloudflared/cloudflared.exe
          $cloudflared = Get-Item src-tauri/tools/cloudflared/cloudflared.exe
          if ($cloudflared.Length -lt 10000000) { throw "Downloaded cloudflared binary is unexpectedly small: $($cloudflared.Length) bytes" }

          Add-Type -AssemblyName System.Drawing
          Get-ChildItem src-tauri/icons -Filter *.png | ForEach-Object {
            $sourcePath = $_.FullName
            $temporaryPath = "$sourcePath.rgba.png"
            $sourceImage = [System.Drawing.Image]::FromFile($sourcePath)
            try {
              $bitmap = New-Object System.Drawing.Bitmap($sourceImage.Width, $sourceImage.Height, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              try {
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                try { $graphics.DrawImage($sourceImage, 0, 0, $sourceImage.Width, $sourceImage.Height) }
                finally { $graphics.Dispose() }
                $bitmap.Save($temporaryPath, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $bitmap.Dispose() }
            } finally { $sourceImage.Dispose() }
            Move-Item $temporaryPath $sourcePath -Force
          }

      - name: Live metadata, poster, database, and card acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /d /s /c "npm run test:metadata-live > release-diagnostics\live-metadata.log 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content release-diagnostics/live-metadata.log
          if ($exitCode -ne 0) { throw "Live metadata acceptance failed with exit code $exitCode" }

      - name: Production frontend build
        run: npm run build

      - name: Rust contract tests and native validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /d /s /c "cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast > release-diagnostics\rust-tests.log 2>&1"
          $testExit = $LASTEXITCODE
          Get-Content release-diagnostics/rust-tests.log
          if ($testExit -ne 0) { throw "Rust tests failed with exit code $testExit" }
          cmd /d /s /c "cargo check --manifest-path src-tauri/Cargo.toml > release-diagnostics\cargo-check.log 2>&1"
          $checkExit = $LASTEXITCODE
          Get-Content release-diagnostics/cargo-check.log
          if ($checkExit -ne 0) { throw "cargo check failed with exit code $checkExit" }

      - name: Generate release validation evidence
        env:
          EVIDENCE_MASTERGATE: success
          EVIDENCE_CONTRACTS: success
          EVIDENCE_PREVENTIVESCAN: success
          EVIDENCE_INSTALL: success
          EVIDENCE_TYPESCRIPT: success
          EVIDENCE_TESTS: success
          EVIDENCE_FRONTEND: success
          EVIDENCE_RUST: success
          EVIDENCE_LIVEMETADATA: success
          EVIDENCE_PACKAGING: not_run
        run: npm run generate:evidence

      - name: Upload validated acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: master-acceptance-${{ needs.authorize.outputs.artifact_slug }}-${{ github.sha }}
          path: |
            build-verification/current-build.json
            contracts/v1/contract-manifest.json
            master-evidence/*
            release-diagnostics/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload release validation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-validation-diagnostics-${{ needs.authorize.outputs.artifact_slug }}-${{ github.sha }}
          path: release-diagnostics/*
          if-no-files-found: warn
          retention-days: 90

  windows-installers:
    name: Build, install, launch, and verify MSI and NSIS
    needs:
      - authorize
      - validate
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Prepare packaging diagnostics
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path release-diagnostics | Out-Null

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Reconfirm release authorization before packaging
        run: npm run verify:master-release

      - name: Prepare genuine Windows bundle resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install wireguard -y --no-progress
          $wireGuardCandidates = @(
            'C:\Program Files\WireGuard\wireguard.exe',
            'C:\Program Files (x86)\WireGuard\wireguard.exe'
          )
          $wireGuardSource = $wireGuardCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wireGuardSource) {
            $wireGuardSource = Get-ChildItem 'C:\Program Files*' -Filter wireguard.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $wireGuardSource) { throw 'A genuine WireGuard executable could not be located.' }
          New-Item -ItemType Directory -Force -Path src-tauri/tools/wireguard | Out-Null
          Copy-Item $wireGuardSource src-tauri/tools/wireguard/wireguard.exe -Force

          New-Item -ItemType Directory -Force -Path src-tauri/tools/cloudflared | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe' -OutFile src-tauri/tools/cloudflared/cloudflared.exe
          $cloudflared = Get-Item src-tauri/tools/cloudflared/cloudflared.exe
          if ($cloudflared.Length -lt 10000000) { throw "Downloaded cloudflared binary is unexpectedly small: $($cloudflared.Length) bytes" }
          $cloudflaredHash = (Get-FileHash $cloudflared.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "cloudflared_sha256=$cloudflaredHash" >> $env:GITHUB_ENV
          "cloudflared_size=$($cloudflared.Length)" >> $env:GITHUB_ENV

          Add-Type -AssemblyName System.Drawing
          Get-ChildItem src-tauri/icons -Filter *.png | ForEach-Object {
            $sourcePath = $_.FullName
            $temporaryPath = "$sourcePath.rgba.png"
            $sourceImage = [System.Drawing.Image]::FromFile($sourcePath)
            try {
              $bitmap = New-Object System.Drawing.Bitmap($sourceImage.Width, $sourceImage.Height, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              try {
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                try { $graphics.DrawImage($sourceImage, 0, 0, $sourceImage.Width, $sourceImage.Height) }
                finally { $graphics.Dispose() }
                $bitmap.Save($temporaryPath, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally { $bitmap.Dispose() }
            } finally { $sourceImage.Dispose() }
            Move-Item $temporaryPath $sourcePath -Force
          }

      - name: Build Tauri installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cmd /d /s /c "npm run tauri build > release-diagnostics\tauri-build.log 2>&1"
          $exitCode = $LASTEXITCODE
          Get-Content release-diagnostics/tauri-build.log
          if ($exitCode -ne 0) { throw "Tauri build failed with exit code $exitCode" }

      - name: Collect, rename, and verify installer artifacts
        shell: pwsh
        env:
          DISPLAY_NAME: ${{ needs.authorize.outputs.display_name }}
          ARTIFACT_SLUG: ${{ needs.authorize.outputs.artifact_slug }}
          SEMANTIC_VERSION: ${{ needs.authorize.outputs.semantic_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $bundles = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File
          $msiSource = $bundles | Where-Object { $_.Extension -eq '.msi' } | Select-Object -First 1
          $nsisSource = $bundles | Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
          if (-not $msiSource) { throw 'The MSI installer was not produced.' }
          if (-not $nsisSource) { throw 'The NSIS installer was not produced.' }

          $msiPath = "release-assets/CinaVault-Premium-$env:ARTIFACT_SLUG-x64.msi"
          $nsisPath = "release-assets/CinaVault-Premium-$env:ARTIFACT_SLUG-x64-setup.exe"
          Copy-Item $msiSource.FullName $msiPath
          Copy-Item $nsisSource.FullName $nsisPath

          $msi = Get-Item $msiPath
          $nsis = Get-Item $nsisPath
          if ($msi.Length -lt 1000000) { throw 'The MSI installer is unexpectedly small.' }
          if ($nsis.Length -lt 1000000) { throw 'The NSIS installer is unexpectedly small.' }

          $msiHash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $nsisHash = (Get-FileHash $nsis.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "# CinaVault Premium $env:DISPLAY_NAME",
            '',
            "Semantic version: $env:SEMANTIC_VERSION",
            '',
            "MSI: $($msi.Name)",
            "MSI bytes: $($msi.Length)",
            "MSI SHA-256: $msiHash",
            '',
            "NSIS: $($nsis.Name)",
            "NSIS bytes: $($nsis.Length)",
            "NSIS SHA-256: $nsisHash",
            '',
            "cloudflared bytes: $env:cloudflared_size",
            "cloudflared SHA-256: $env:cloudflared_sha256"
          ) | Set-Content release-assets/CHECKSUMS.txt
          Copy-Item release-assets/CHECKSUMS.txt release-diagnostics/CHECKSUMS.txt

      - name: Install and launch packaged MSI
        shell: pwsh
        env:
          ARTIFACT_SLUG: ${{ needs.authorize.outputs.artifact_slug }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path "release-assets/CinaVault-Premium-$env:ARTIFACT_SLUG-x64.msi").Path
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "MSI installation failed with exit code $($install.ExitCode)" }

          $uninstallRoots = @(
            'Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'Registry::HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'Registry::HKEY_LOCAL_MACHINE\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $installed = $uninstallRoots |
            ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } |
            Where-Object { $_.DisplayName -like 'CinaVault Premium*' } |
            Select-Object -First 1

          $displayIconPath = $null
          if ($installed -and $installed.DisplayIcon) {
            $displayIconPath = ($installed.DisplayIcon -replace ',\d+$', '').Trim('"')
          }

          $roots = @()
          if ($installed -and $installed.InstallLocation) { $roots += $installed.InstallLocation }
          $roots += @(
            (Join-Path $env:LOCALAPPDATA 'CinaVault Premium'),
            (Join-Path $env:ProgramFiles 'CinaVault Premium'),
            (Join-Path ${env:ProgramFiles(x86)} 'CinaVault Premium')
          )
          $exe = if ($displayIconPath -and (Test-Path $displayIconPath -PathType Leaf)) {
            Get-Item $displayIconPath
          } else {
            $executableNames = @('cinavault-premium.exe', 'CinaVault Premium.exe')
            $roots |
              Where-Object { $_ -and (Test-Path $_) } |
              ForEach-Object {
                $root = $_
                $executableNames | ForEach-Object {
                  Get-ChildItem $root -Filter $_ -File -Recurse -ErrorAction SilentlyContinue
                }
              } |
              Select-Object -First 1
          }
          if (-not $exe) {
            $checkedRoots = ($roots | Where-Object { $_ } | Select-Object -Unique) -join '; '
            throw "MSI installed but the CinaVault executable could not be located. DisplayIcon='$displayIconPath'; searched roots: $checkedRoots"
          }

          $process = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Installed app exited during launch validation with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

          @(
            "msi_install_exit=$($install.ExitCode)",
            "installed_executable=$($exe.FullName)",
            'launch_alive_after_seconds=8',
            'launch_validation=passed'
          ) | Set-Content release-diagnostics/installer-launch-validation.txt

          $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 1605, 3010)) { throw "MSI cleanup failed with exit code $($uninstall.ExitCode)" }
          "msi_uninstall_exit=$($uninstall.ExitCode)" | Add-Content release-diagnostics/installer-launch-validation.txt

      - name: Upload verified Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinavault-${{ needs.authorize.outputs.artifact_slug }}-windows-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload packaging diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packaging-diagnostics-${{ needs.authorize.outputs.artifact_slug }}-${{ github.sha }}
          path: release-diagnostics/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish verified release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.authorize.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: CinaVault Premium ${{ needs.authorize.outputs.display_name }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

  report-success:
    name: Report verified release
    needs:
      - authorize
      - windows-installers
    runs-on: ubuntu-latest
    steps:
      - name: Post verified release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DISPLAY_NAME: ${{ needs.authorize.outputs.display_name }}
          RELEASE_TAG: ${{ needs.authorize.outputs.release_tag }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELEASE_MONITOR_ISSUE),
              body: `${process.env.DISPLAY_NAME} passed the master gate and was published.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nRelease: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/tag/${process.env.RELEASE_TAG}`
            });

  report-failure:
    name: Report blocked release
    needs:
      - authorize
      - validate
      - windows-installers
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failed or blocked run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DISPLAY_NAME: ${{ needs.authorize.outputs.display_name }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELEASE_MONITOR_ISSUE),
              body: `${process.env.DISPLAY_NAME || 'Current manifest build'} was blocked by validation or packaging.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}`
            });
