name: CinaVault Premium v2 Build 1.02 Publish

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

concurrency:
  group: cinavault-v2-build-1-02-release
  cancel-in-progress: false

env:
  RELEASE_MONITOR_ISSUE: "51"

jobs:
  authorize:
    name: Authorize v2 Build 1.02 release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 51 &&
       github.event.comment.body == '/release v2-build-1.02' &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.authorization.outputs.allowed }}
    steps:
      - name: Authorize owner release command
        id: authorization
        shell: bash
        run: echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Register release run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELEASE_MONITOR_ISSUE),
              body: `CinaVault Premium v2 Build 1.02 release run started: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCommit: ${context.sha}`
            });

  validate:
    name: v2 Build 1.02 regression gate
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Carry-forward and v2 Build 1.02 regression tests
        run: npm run test:all

      - name: Production frontend build
        run: npm run build

  windows-installers:
    name: v2 Build 1.02 MSI and NSIS
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare genuine Windows bundle resources
        shell: pwsh
        run: |
          choco install wireguard -y --no-progress
          $wireGuardCandidates = @(
            'C:\Program Files\WireGuard\wireguard.exe',
            'C:\Program Files (x86)\WireGuard\wireguard.exe'
          )
          $wireGuardSource = $wireGuardCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $wireGuardSource) {
            $wireGuardSource = Get-ChildItem 'C:\Program Files*' -Filter wireguard.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $wireGuardSource) {
            throw 'A genuine WireGuard executable could not be located after installation.'
          }
          New-Item -ItemType Directory -Force -Path src-tauri/tools/wireguard | Out-Null
          Copy-Item $wireGuardSource src-tauri/tools/wireguard/wireguard.exe -Force

          New-Item -ItemType Directory -Force -Path src-tauri/tools/cloudflared | Out-Null
          $cloudflaredUrl = 'https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe'
          Invoke-WebRequest -Uri $cloudflaredUrl -OutFile src-tauri/tools/cloudflared/cloudflared.exe
          $cloudflared = Get-Item src-tauri/tools/cloudflared/cloudflared.exe
          if ($cloudflared.Length -lt 10000000) {
            throw "Downloaded cloudflared binary is unexpectedly small: $($cloudflared.Length) bytes"
          }
          $cloudflaredHash = (Get-FileHash $cloudflared.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "cloudflared_sha256=$cloudflaredHash" >> $env:GITHUB_ENV
          "cloudflared_size=$($cloudflared.Length)" >> $env:GITHUB_ENV

          Add-Type -AssemblyName System.Drawing
          Get-ChildItem src-tauri/icons -Filter *.png | ForEach-Object {
            $sourcePath = $_.FullName
            $temporaryPath = "$sourcePath.rgba.png"
            $sourceImage = [System.Drawing.Image]::FromFile($sourcePath)
            try {
              $bitmap = New-Object System.Drawing.Bitmap($sourceImage.Width, $sourceImage.Height, [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              try {
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                try {
                  $graphics.DrawImage($sourceImage, 0, 0, $sourceImage.Width, $sourceImage.Height)
                } finally {
                  $graphics.Dispose()
                }
                $bitmap.Save($temporaryPath, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                $bitmap.Dispose()
              }
            } finally {
              $sourceImage.Dispose()
            }
            Move-Item $temporaryPath $sourcePath -Force
          }

      - name: Native Rust validation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri installers
        run: npm run tauri build

      - name: Collect, rename, and verify installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $bundleFiles = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -File
          $msiSource = $bundleFiles | Where-Object { $_.Extension -eq '.msi' } | Select-Object -First 1
          $nsisSource = $bundleFiles | Where-Object { $_.Extension -eq '.exe' } | Select-Object -First 1
          if (-not $msiSource) { throw 'The v2 Build 1.02 MSI installer was not produced.' }
          if (-not $nsisSource) { throw 'The v2 Build 1.02 NSIS installer was not produced.' }

          $msiPath = 'release-assets/CinaVault-Premium-v2-Build-1.02-x64.msi'
          $nsisPath = 'release-assets/CinaVault-Premium-v2-Build-1.02-x64-setup.exe'
          Copy-Item $msiSource.FullName $msiPath -Force
          Copy-Item $nsisSource.FullName $nsisPath -Force

          $msi = Get-Item $msiPath
          $nsis = Get-Item $nsisPath
          if ($msi.Length -lt 1000000) { throw 'The MSI installer is unexpectedly small.' }
          if ($nsis.Length -lt 1000000) { throw 'The NSIS installer is unexpectedly small.' }

          $msiHash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $nsisHash = (Get-FileHash $nsis.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            '# CinaVault Premium v2 Build 1.02',
            '',
            'White-screen navigation stability hotfix',
            '',
            "MSI: $($msi.Name)",
            "MSI bytes: $($msi.Length)",
            "MSI SHA-256: $msiHash",
            '',
            "NSIS: $($nsis.Name)",
            "NSIS bytes: $($nsis.Length)",
            "NSIS SHA-256: $nsisHash",
            '',
            "cloudflared bytes: $env:cloudflared_size",
            "cloudflared SHA-256: $env:cloudflared_sha256"
          ) | Set-Content release-assets/V2-BUILD-1.02-CHECKSUMS.txt

      - name: Upload v2 Build 1.02 installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cinavault-v2-build-1-02-windows-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish CinaVault Premium v2 Build 1.02
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v2-build-1.02
          target_commitish: ${{ github.sha }}
          name: CinaVault Premium v2 Build 1.02
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

  report-success:
    name: Report v2 Build 1.02 success
    needs: windows-installers
    runs-on: ubuntu-latest
    steps:
      - name: Post verified release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELEASE_MONITOR_ISSUE),
              body: `CinaVault Premium v2 Build 1.02 release workflow succeeded.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nRelease: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/releases/tag/v2-build-1.02`
            });

  report-failure:
    name: Report v2 Build 1.02 failure
    needs:
      - authorize
      - validate
      - windows-installers
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failed run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.RELEASE_MONITOR_ISSUE),
              body: `CinaVault Premium v2 Build 1.02 release workflow failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}`
            });
